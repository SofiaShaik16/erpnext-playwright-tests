name: Nightly Playwright Run

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chrome
      - name: Run tests
        run: npx playwright test --workers=1 --config=playwright.recorded.config.js
        env:
          FRAPPE_BASE_URL: ${{ secrets.BASE_URL }}
          FRAPPE_USER: ${{ secrets.TEST_USER }}
          FRAPPE_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
